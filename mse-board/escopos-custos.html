<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSE Board (Escopos e Custos)</title>
<script>
    // Manda pro board.html de verdade, já marcando o departamento —
    // e preserva qualquer outro parâmetro que tenha vindo na URL (como o
    // ?sso=... que o Portal manda pro login automático).
    const params = new URLSearchParams(window.location.search);
    params.set('dept', 'escopos_custos');
    window.location.replace('board.html?' + params.toString());
</script>
</head>
<body>
    <p>Abrindo o MSE Board (Escopos e Custos)...</p>
</body>
</html>
