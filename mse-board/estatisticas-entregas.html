<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estatísticas de Entregas — MSE Board</title>
<link rel="icon" type="image/png" href="https://mseboard.portalmse.com.br/mse-board/logo-mse-circle.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Reaproveita o MESMO CSS do MSE Board, pra ficar visualmente idêntico -->
<link rel="stylesheet" href="https://mseboard.portalmse.com.br/mse-board/style.css">
<style>
    /* Esse arquivo vive fora do MSE Board — não é um modal, é a própria página */
    body { background-color: var(--bg); min-height: 100vh; }
    html, body { margin: 0; padding: 0; width: 100%; height: auto; min-height: 100vh; overflow-y: auto; overflow-x: hidden; }
    .standalone-page-wrap { width: 100%; margin: 0; padding: 1.2rem 1.5rem 2.5rem; box-sizing: border-box; }
    .standalone-topbar {
        display: flex; align-items: center; justify-content: space-between;
        margin: 0 0 1.2rem; padding: 0.6rem 1.5rem;
        flex-wrap: wrap; gap: 0.8rem;
        color: #fff;
        background:
            radial-gradient(640px 360px at 85% -30%, rgba(64, 120, 210, 0.5), transparent 62%),
            linear-gradient(118deg, #13223b 0%, #193053 68%, var(--navy-2) 100%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .standalone-topbar-brand { display: flex; align-items: center; gap: 0.6rem; font-weight: 700; font-size: 0.95rem; color: #fff; }
    .standalone-topbar-brand img { height: 22px; width: auto; display: block; }
    .standalone-logo-link { display: flex; align-items: center; opacity: 0.9; transition: opacity 0.15s ease, transform 0.15s ease; }
    .standalone-logo-link:hover { opacity: 1; transform: scale(1.08); }
    .standalone-nav-links { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .standalone-nav-links a {
        text-decoration: none; font-size: 0.82rem; font-weight: 600; padding: 0.5rem 0.9rem;
        border-radius: var(--radius-s); border: 1px solid rgba(255, 255, 255, 0.25); color: #fff;
        transition: background-color 0.15s ease;
    }
    .standalone-nav-links a.is-current { background-color: var(--accent); color: #fff; border-color: var(--accent); }
    .standalone-nav-links a:not(.is-current):hover { background-color: rgba(255, 255, 255, 0.12); }
    #standaloneViewerLabel { font-size: 0.76rem; color: rgba(255, 255, 255, 0.75); }
</style>
</head>
<body data-standalone-dashboard="true">

    <div class="standalone-topbar">
        <div class="standalone-topbar-brand">
            <a href="https://portalmse.com.br/" title="Voltar ao Portal MSE" class="standalone-logo-link">
                <img src="https://mseboard.portalmse.com.br/mse-board/logo-mse-circle.png" alt="MSE">
            </a>
            <span>Estatísticas de Entregas</span>
        </div>
        <div class="standalone-nav-links">
            <a href="dashboard-entregas.html">Dashboard de Entregas</a>
            <a href="estatisticas-entregas.html" class="is-current">Estatísticas de Entregas</a>
        </div>
        <span id="standaloneViewerLabel"></span>
    </div>

    <div class="standalone-page-wrap">
        <div class="dashboard-section">
            <div class="dsg-sec">Ranking de Entregas <span class="ct">no prazo × atrasado</span></div>

            <div class="dashboard-podiums">
                <div class="dashboard-podium-col">
                    <div class="dashboard-podium-heading dashboard-podium-heading-warn"><i class="fa-solid fa-triangle-exclamation"></i> Atrasados</div>
                    <div id="reportPodiumWorst"></div>
                </div>
                <div class="dashboard-podium-col">
                    <div class="dashboard-podium-heading"><i class="fa-solid fa-trophy"></i> No Prazo</div>
                    <div id="reportPodiumBest"></div>
                </div>
            </div>

            <div class="dashboard-filter-bar">
                <div class="dashboard-filter-field">
                    <label>De</label>
                    <input type="date" id="reportDateFrom">
                </div>
                <div class="dashboard-filter-field">
                    <label>Até</label>
                    <input type="date" id="reportDateTo">
                </div>
                <button type="button" id="reportClearPeriodBtn" class="dashboard-clear-btn">Limpar período</button>
                <span class="dashboard-filter-note" id="reportPeriodNote">Todas as entregas registradas</span>
            </div>

            <div class="dashboard-table-wrap">
                <table class="dashboard-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Responsável</th>
                            <th>No Prazo</th>
                            <th>Atrasadas</th>
                            <th>Total Entregue</th>
                            <th>Proporção</th>
                            <th>% No Prazo</th>
                        </tr>
                    </thead>
                    <tbody id="reportByPerson"></tbody>
                </table>
            </div>
        </div>

        <div class="dashboard-section" style="margin-top:0.5rem;">
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-value" id="reportTotalDone">0</div><div class="stat-label">Concluídos (total)</div></div>
                <div class="stat-card"><div class="stat-value" id="reportOnTimePct" style="color:var(--green);">0%</div><div class="stat-label">No prazo</div></div>
                <div class="stat-card"><div class="stat-value" id="reportLatePct" style="color:var(--red);">0%</div><div class="stat-label">Atrasados</div></div>
            </div>

            <div class="input-group" style="margin-top:1.2rem;">
                <label>Tarefas concluídas por período</label>
                <div class="corner-options">
                    <button type="button" class="report-period-btn is-current" data-period="day">Dia</button>
                    <button type="button" class="report-period-btn" data-period="week">Semana</button>
                    <button type="button" class="report-period-btn" data-period="month">Mês</button>
                </div>
            </div>

            <div id="reportChart" class="chart-section" style="margin-top:0.8rem;"></div>

            <div style="display:flex; gap:0.6rem; margin-top:1.2rem;">
                <button type="button" id="exportReportCsvBtn" class="btn-secondary" style="flex:1;"><i class="fa-solid fa-download"></i> Exportar Excel (CSV)</button>
                <button type="button" id="printReportBtn" class="btn-secondary" style="flex:1;"><i class="fa-solid fa-print"></i> Imprimir / Salvar PDF</button>
            </div>
        </div>
    </div>

    <div id="confirmModal" class="modal">
        <div class="modal-content confirm-modal-content">
            <div class="confirm-icon">!</div>
            <h3 id="confirmModalTitle">Tem certeza?</h3>
            <p id="confirmModalMessage" class="confirm-message"></p>
            <div class="confirm-actions">
                <button type="button" id="confirmCancelBtn" class="btn-secondary">Cancelar</button>
                <button type="button" id="confirmOkBtn" class="btn-primary">Confirmar</button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <!-- Configuração da API (mesma do MSE Board) -->
    <script src="https://mseboard.portalmse.com.br/mse-board/config.js.php"></script>
    <!-- Mesmo script.js do MSE Board — ele detecta data-standalone-dashboard
         no <body> acima e só roda a parte de buscar dados + montar o relatório. -->
    <script src="https://mseboard.portalmse.com.br/mse-board/script.js"></script>
</body>
</html>
