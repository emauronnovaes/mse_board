<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body style="font:12px monospace;white-space:pre">
<div id="out">...</div>
<iframe id="f" src="relatorio.html?dept=programacao" style="width:1300px;height:400px;border:0"></iframe>
<script>
localStorage.setItem('mse_user', JSON.stringify({name:'admin@mse.com.br', role:'Admin'}));
const erros=[]; let t='';
setTimeout(()=>{
 try{
  const w=document.getElementById('f').contentWindow, d=document.getElementById('f').contentDocument;
  w.onerror=(m)=>erros.push(m);
  const alvo=d.getElementById('relatorioConteudo');
  t+='=== SEM CLICAR EM NADA ===\n';
  t+='container existe: '+!!alvo+'\n';
  t+='conteudo renderizado (chars): '+(alvo?alvo.innerHTML.length:0)+'\n';
  t+='tem cabecalho do relatorio: '+(alvo&&alvo.textContent.includes('Backlog e Entregas'))+'\n';
  t+='tem "1. Visao geral": '+(alvo&&/1\.\s*Visão geral/.test(alvo.textContent))+'\n';
  t+='tem tabela: '+(alvo?alvo.querySelectorAll('table').length:0)+' tabela(s)\n';
  t+='linhas na visao geral: '+(alvo?alvo.querySelectorAll('.rel-tabela tbody tr').length:0)+'\n';
  t+='cards no state: '+w.eval('(state.cards||[]).length')+'\n';
  t+='pessoas no state: '+w.eval('(state.people||[]).length')+'\n';
  t+='\nerros de JS: '+(erros.length? erros.join(' | ') : 'nenhum')+'\n';
 }catch(e){ t+='ERRO: '+e.message; }
 document.getElementById('out').textContent=t;
},5000);
</script></body></html>
