<link rel="stylesheet" href="style.css">
<style>
    body { background-color: var(--bg); min-height: 100vh; }
    html, body { margin: 0; padding: 0; width: 100%; height: auto; min-height: 100vh; overflow-y: auto; overflow-x: hidden; }
    .standalone-page-wrap { width: 100%; margin: 0; padding: 1.2rem 1.5rem 2.5rem; box-sizing: border-box; }
    .standalone-topbar {
        display: flex; align-items: center; justify-content: space-between;
        margin: 0 0 1.2rem; padding: 0.6rem 1.5rem;
        flex-wrap: wrap; gap: 0.8rem;
        color: #fff;
        background:
            radial-gradient(640px 360px at 85% -30%, rgba(64, 120, 210, 0.5), transparent 62%),
            linear-gradient(118deg, #13223b 0%, #193053 68%, var(--navy-2) 100%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .standalone-topbar-brand { display: flex; align-items: center; gap: 0.6rem; font-weight: 700; font-size: 0.95rem; color: #fff; }
    .standalone-logo-link {
        display: flex; align-items: center; text-decoration: none;
        font-family: "IBM Plex Sans", sans-serif; font-weight: 800; font-size: 1.1rem;
        color: #ff4d4d; letter-spacing: -0.5px;
        opacity: 0.95; transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .standalone-logo-link:hover { opacity: 1; transform: scale(1.08); }
    .standalone-nav-links { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .standalone-nav-links a {
        text-decoration: none; font-size: 0.82rem; font-weight: 600; padding: 0.5rem 0.9rem;
        border-radius: var(--radius-s); border: 1px solid rgba(255, 255, 255, 0.25); color: #fff;
        transition: background-color 0.15s ease;
    }
    .standalone-nav-links a.is-current { background-color: var(--accent); color: #fff; border-color: var(--accent); }
    .standalone-nav-links a:not(.is-current):hover { background-color: rgba(255, 255, 255, 0.12); }
    #standaloneViewerLabel { font-size: 0.76rem; color: rgba(255, 255, 255, 0.75); }
</style>
</head>
<body data-standalone-pendencias="true">

    <div class="standalone-topbar">
        <div class="standalone-topbar-brand">
            <a href="https://portalmse.com.br/" title="Voltar ao Portal MSE" class="standalone-logo-link">MSE</a>
            <span>Pendências por Pessoa</span>
        </div>
        <div class="standalone-nav-links">
            <a href="pendencias.html" class="is-current">Pendências por Pessoa</a>
            <a href="dashboard-entregas.html">Dashboard de Entregas</a>
            <a href="estatisticas-entregas.html">Estatísticas de Entregas</a>
        </div>
        <span id="standaloneViewerLabel"></span>
    </div>

    <!-- Propaga o ?dept= nos links do topo. É inline de propósito: as páginas
         soltas carregam o script.js do servidor de produção, então enquanto
         uma versão antiga estiver no ar a navegação continuaria mandando todo
         mundo pra Programação. Aqui não depende de deploy do script.js. -->
    <script>
    (function () {
        var KEY = 'mse_dept_dashboards';
        var params = new URLSearchParams(location.search);
        var dept = params.get('dept');

        if (!dept) {
            // Abriu sem ?dept=. São dois casos bem diferentes:
            //  - veio do Portal / link novo  -> é Programação mesmo (padrão);
            //  - veio de outra página daqui  -> quase sempre é uma cópia velha
            //    desta tela servida do CACHE do navegador, de antes desta
            //    correção, cujos links ainda não levavam o departamento.
            // Só no segundo caso recupera o que ficou guardado, senão abrir
            // Programação de propósito seria sequestrado de volta pra
            // Planejamento.
            // Compara pela ORIGEM, não pelo caminho: no XAMPP o site mora em
            // /mse_board/mse-board/ e em produção em /mse-board/, então casar
            // pedaço de caminho quebrava num dos dois.
            var veioDaquiDentro = document.referrer.indexOf(location.origin) === 0;
            var lembrado = null;
            try { lembrado = sessionStorage.getItem(KEY); } catch (e) { /* aba anônima */ }

            if (veioDaquiDentro && lembrado) {
                dept = lembrado;
                params.set('dept', dept);
                // Corrige a URL ANTES do script.js carregar: é de
                // location.search que ele tira o departamento, e ele lê isso
                // uma vez só, ao ser interpretado.
                history.replaceState(null, '', location.pathname + '?' + params.toString());
            }
        }

        dept = dept || 'programacao';
        try { sessionStorage.setItem(KEY, dept); } catch (e) { /* aba anônima */ }

        // Todo link sai com o departamento escrito, inclusive programacao:
        // link explícito não depende de o destino adivinhar nada.
        document.querySelectorAll('.standalone-nav-links a').forEach(function (a) {
            var destino = (a.getAttribute('href') || '').split('?')[0];
            if (!destino || destino.indexOf('http') === 0) return;
            a.setAttribute('href', destino + '?dept=' + encodeURIComponent(dept));
        });
    })();
    </script>


    <div class="standalone-page-wrap">

        <div class="pend-head">
            <div>
                <h1 class="pend-title">Pendências por Pessoa</h1>
                <p class="pend-subtitle" id="pendSubtitle">Só o que está em aberto · arraste os cards entre as colunas</p>
            </div>
            <select id="pendPersonFilter" class="pend-person-filter">
                <option value="">Todas as pessoas</option>
            </select>
        </div>

        <!-- Números do topo. "Concluído" fica de fora de propósito: esta tela
             é só do que ainda está em aberto. -->
        <div class="pend-stats" id="pendStats"></div>

        <div class="pend-chart-card">
            <div class="pend-chart-title">Distribuição por pessoa</div>
            <div class="pend-chart-legend" id="pendChartLegend"></div>
            <div class="pend-chart" id="pendChart"></div>
        </div>

        <div class="pend-board" id="pendBoard"></div>

    </div>

    <div id="confirmModal" class="modal">
        <div class="modal-content confirm-modal-content">
            <div class="confirm-icon">!</div>
            <h3 id="confirmModalTitle">Tem certeza?</h3>
            <p id="confirmModalMessage" class="confirm-message"></p>
            <div class="confirm-actions">
                <button type="button" id="confirmCancelBtn" class="btn-secondary">Cancelar</button>
                <button type="button" id="confirmOkBtn" class="btn-primary">Confirmar</button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="config.js.php"></script>
    <script src="script.js"></script>
</body>
</html>
